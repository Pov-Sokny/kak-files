name: Frontend Super File CI/CD Build and Deploy

on:
  push:
    branches: [ "deploy" ] # Or main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/survey-frontend:latest
          # PASS THE API URL HERE
          build-args: |
            NEXT_PUBLIC_API_URL=https://sa-api.supersurvey.live/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Move to where your frontend docker-compose is
            cd /home/${{ secrets.VM_USER }}/online_survey/SA-Online-Survey-V1/
            
            export DOCKER_USER=${{ secrets.DOCKERHUB_USERNAME }}

            git checkout deploy
            git pull
          
            # 2. Pull new image
            docker compose pull frontend
            
            # 3. Restart the service
            docker compose up -d frontend
            
            # 4. Cleanup
            docker image prune -f

  notify:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Get current date
        id: date
        run: echo "DEPLOY_DATE=$(date +'%d/%m/%Y %H:%M:%S')" >> $GITHUB_ENV

      - name: Send Telegram Notification via Curl
        run: |
          # We use a multi-line variable to preserve your formatting and handle special characters
          MESSAGE="🎉 *NEW ACTION!* 🎉
          ----------------------------------------
          • *Project* : \`Frontend\`
          • *Domain* : \`supersurvey.live\`
          • *Repository* : \`${{ github.repository }}\`
          • *Author* : \`${{ github.actor }}\`
          • *Branch* : \`${{ github.ref_name }}\`
          • *Status* : \`${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}\`
          • *Deploy Date* : \`${{ env.DEPLOY_DATE }}\`
          • *Message* : \`${{ github.event.head_commit.message }}\`
          ----------------------------------------
          [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
  
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
            -d "message_thread_id=${{ secrets.TELEGRAM_TOPIC }}" \
            -d "parse_mode=markdown" \
            -d "text=$MESSAGE"
